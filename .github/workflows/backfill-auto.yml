name: backfill-auto
# 過去データの自動取得（Gemini作成、Claude修正）。
# config/backfill_range.txt（"開始,終了"）の期間を、まだ「月完了」の印がない最初の月から取る。
# 1回の実行（約5時間半）で1か月の半分ほど進むので、6時間ごとに続きから取る。
on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
concurrency: { group: keirin-fetch, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions: { contents: read }
    outputs:
      should_dispatch: ${{ steps.check_progress.outputs.should_dispatch }}
    env: { PYTHONPATH: "${{ github.workspace }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { rclone_config: "${{ secrets.RCLONE_CONFIG }}" }
      - name: 取得済みの記録をDriveから取得
        id: pull_done
        run: |
          rclone copy gdrive:keirin-predictor/data data --include "_done/**"
          rclone check gdrive:keirin-predictor/data data --one-way --include "_done/**"
      - name: まだ終わっていない最初の月を決める
        id: month
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, pathlib
          s, e = open("config/backfill_range.txt").read().strip().split(",")
          s, e = datetime.date.fromisoformat(s), datetime.date.fromisoformat(e)
          cur = s.replace(day=1)
          # 日次取得（daily-fetch）が書き込む最近の月（前日を含む月以降）には触らない。
          # 2つのジョブが同じ月のファイルを上書きし合わないようにするため
          jst_today = (datetime.datetime.utcnow() + datetime.timedelta(hours=9)).date()
          daily_from = (jst_today - datetime.timedelta(days=1)).replace(day=1)
          while cur <= e and cur < daily_from:
              f = pathlib.Path(f"data/_done/{cur:%Y}/{cur:%Y-%m}.txt")
              if not (f.exists() and f"*|{cur:%Y-%m}-01|month_complete" in f.read_text()):
                  nxt = (cur.replace(day=28) + datetime.timedelta(days=4)).replace(day=1)
                  print(f"start={max(s, cur)}")
                  print(f"end={min(e, nxt - datetime.timedelta(days=1))}")
                  print(f"ym={cur:%Y-%m}")
                  print(f"y={cur:%Y}")
                  break
              cur = (cur.replace(day=28) + datetime.timedelta(days=4)).replace(day=1)
          else:
              print("done=1")
          PY
      - name: 全期間取得済み
        if: steps.month.outputs.done == '1'
        run: echo "config/backfill_range.txt の期間はすべて取得済みです。期間を書き換えるか、このワークフローを無効にしてください。"
      - name: その月のParquetをDriveから取得
        id: pull_parquet
        if: steps.month.outputs.done != '1'
        run: |
          rclone copy gdrive:keirin-predictor/data data --include "*/${{ steps.month.outputs.y }}/${{ steps.month.outputs.ym }}.parquet"
          rclone check gdrive:keirin-predictor/data data --one-way --include "*/${{ steps.month.outputs.y }}/${{ steps.month.outputs.ym }}.parquet"
      - name: 取得
        if: steps.month.outputs.done != '1' && steps.pull_parquet.outcome == 'success'
        run: python -m keirin.scripts.collect --start "${{ steps.month.outputs.start }}" --end "${{ steps.month.outputs.end }}" --max-minutes 300
      - name: Driveへ保存
        id: save
        if: always() && steps.month.outputs.done != '1' && steps.pull_done.outcome == 'success' && steps.pull_parquet.outcome == 'success'
        run: |
          if [ -d data ]; then
            rclone copy data gdrive:keirin-predictor/data --exclude "_done/**"
            rclone check data gdrive:keirin-predictor/data --one-way --exclude "_done/**"
            rclone copy data gdrive:keirin-predictor/data --include "_done/**"
            rclone check data gdrive:keirin-predictor/data --one-way --include "_done/**"
          fi
      - name: 進捗確認
        id: check_progress
        if: success() && steps.month.outputs.done != '1' && steps.save.outcome == 'success'
        # この実行で何も新しく取れなかったときは再起動しない（空回り防止。次の定時実行に任せる）
        run: |
          n=$(cat collect_progress.txt 2>/dev/null || echo 0)
          echo "この実行で新しく取得: $n"
          if [ "$n" -gt 0 ]; then
            echo "should_dispatch=1" >> "$GITHUB_OUTPUT"
          else
            echo "新しい取得がないので再起動しません"
            echo "should_dispatch=0" >> "$GITHUB_OUTPUT"
          fi
  dispatch:
    needs: backfill
    if: success() && needs.backfill.outputs.should_dispatch == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: write }
    steps:
      - uses: actions/checkout@v4
      - name: 続きがあれば自分をもう一度起動（GitHubの定時実行が抜けることがあるため）
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run backfill-auto.yml --ref main
