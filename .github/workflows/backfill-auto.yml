name: backfill-auto
# 過去データの自動取得（Gemini作成、Claude修正）。
# config/backfill_range.txt（"開始,終了"）の期間を、まだ「月完了」の印がない最初の月から取る。
# 1回の実行（約5時間半）で1か月の半分ほど進むので、6時間ごとに続きから取る。
on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
concurrency: { group: keirin-fetch, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions: { contents: read }
    outputs:
      should_dispatch: ${{ steps.check_progress.outputs.should_dispatch }}
    env: { PYTHONPATH: "${{ github.workspace }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { rclone_config: "${{ secrets.RCLONE_CONFIG }}" }
      - name: 取得済みの記録をDriveから取得
        id: pull_done
        run: |
          rclone copy gdrive:keirin-predictor/data data --include "_done/**"
          rclone check gdrive:keirin-predictor/data data --one-way --include "_done/**"
      - name: まだ終わっていない最初の月を決める
        id: month
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from keirin.scripts.collect import select_backfill_month
          for k, v in select_backfill_month().items():
              print(f"{k}={v}")
          PY
      - name: 全期間取得済みまたは日次取得の対象月
        if: steps.month.outputs.done == '1'
        run: |
          if [ "${{ steps.month.outputs.deferred }}" = "1" ]; then
            echo "deferred: month owned by daily-fetch (${{ steps.month.outputs.ym }})。残りの月は日次取得（daily-fetch）が担当するため、遡り取得は待機します。"
          else
            echo "range complete: config/backfill_range.txt の期間はすべて取得済みです。期間を書き換えるか、このワークフローを無効にしてください。"
          fi
      - name: その月のParquetをDriveから取得
        id: pull_parquet
        if: steps.month.outputs.done != '1'
        run: |
          rclone copy gdrive:keirin-predictor/data data --include "${{ steps.month.outputs.parquet_inc }}"
          rclone check gdrive:keirin-predictor/data data --one-way --include "${{ steps.month.outputs.parquet_inc }}"
      - name: 取得
        if: steps.month.outputs.done != '1' && steps.pull_parquet.outcome == 'success'
        run: python -m keirin.scripts.collect --start "${{ steps.month.outputs.start }}" --end "${{ steps.month.outputs.end }}" --max-minutes 300
      - name: Driveへ保存
        id: save
        if: always() && steps.month.outputs.done != '1' && steps.pull_done.outcome == 'success' && steps.pull_parquet.outcome == 'success'
        run: |
          if [ -d data ]; then
            rclone copy data gdrive:keirin-predictor/data --include "${{ steps.month.outputs.parquet_inc }}"
            rclone check data gdrive:keirin-predictor/data --one-way --include "${{ steps.month.outputs.parquet_inc }}"
            rclone copy data gdrive:keirin-predictor/data --include "${{ steps.month.outputs.done_inc }}"
            rclone check data gdrive:keirin-predictor/data --one-way --include "${{ steps.month.outputs.done_inc }}"
          fi
      - name: 進捗確認
        id: check_progress
        if: success() && steps.month.outputs.done != '1' && steps.save.outcome == 'success'
        # この実行で何も新しく取れなかったときは再起動しない（空回り防止。次の定時実行に任せる）
        run: |
          n=$(cat collect_progress.txt 2>/dev/null || echo 0)
          echo "この実行で新しく取得: $n"
          if [ "$n" -gt 0 ]; then
            echo "should_dispatch=1" >> "$GITHUB_OUTPUT"
          else
            echo "新しい取得がないので再起動しません"
            echo "should_dispatch=0" >> "$GITHUB_OUTPUT"
          fi
  dispatch:
    needs: backfill
    if: success() && needs.backfill.outputs.should_dispatch == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: write }
    steps:
      - uses: actions/checkout@v5
      - name: 続きがあれば自分をもう一度起動（GitHubの定時実行が抜けることがあるため）
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run backfill-auto.yml --ref main
